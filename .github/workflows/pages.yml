name: Pages

on:
  push:
    branches:
      - main
      - claude/deploy-pages-cleanup-data-ez0j3l
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # движок смотрелки ставится сюда же: без него страница соберётся,
      # но без 3D, а это тихая потеря
      - run: npm i --omit=optional --no-audit --no-fund
      # правила — это ворота: сайт не собирается с нарушениями геометрии
      - run: npm run check
      # и сами правила тоже проверяются: каждое обязано поймать свой дефект
      - run: npm run selftest
      # выгрузка проверяет сама себя: ссылки, количества, вырезанные проёмы
      - run: npm run ifc
      - run: npm run site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
